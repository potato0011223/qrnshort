<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="16" fill="#0f172a" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>
  
  <!-- QR Pattern Elements -->
  <!-- Top Left Finder -->
  <rect x="12" y="12" width="16" height="16" rx="4" fill="none" stroke="url(#grad)" stroke-width="2.5" />
  <rect x="16.5" y="16.5" width="7" height="7" rx="1.5" fill="url(#grad)" />
  
  <!-- Top Right Finder -->
  <rect x="36" y="12" width="16" height="16" rx="4" fill="none" stroke="url(#grad)" stroke-width="2.5" />
  <rect x="40.5" y="16.5" width="7" height="7" rx="1.5" fill="url(#grad)" />
  
  <!-- Bottom Left Finder -->
  <rect x="12" y="36" width="16" height="16" rx="4" fill="none" stroke="url(#grad)" stroke-width="2.5" />
  <rect x="16.5" y="40.5" width="7" height="7" rx="1.5" fill="url(#grad)" />
  
  <!-- Short URL Link in Bottom Right -->
  <path d="M 37 43 C 35 41, 35 37, 39 33 L 42 30 C 45 27, 49 27, 52 30 C 55 33, 55 37, 52 40 L 50 42" 
        fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 45 37 C 47 39, 47 43, 43 47 L 40 50 C 37 53, 33 53, 30 50 C 27 47, 27 43, 30 40 L 32 38" 
        fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" />
</svg>
